name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test and verification tools
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "jsonschema>=4.23"
          "pytest>=8.4"
          "pytest-cov>=6.2"
          "ruff>=0.12"
      - name: Verify release surfaces
        run: python scripts/verify-release.py
      - name: Lint
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --cov=briefspec --cov-report=term-missing

  plugin-hosts:
    name: Codex and Claude plugin validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install structural verifier
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.23"
      - name: Verify release surfaces
        run: python scripts/verify-release.py
      - name: Install current public host CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - name: Codex plugin validator
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        run: |
          mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "$GITHUB_WORKSPACE" --json
          codex plugin add brief-spec@brief-spec --json
          codex plugin list
      - name: Claude plugin validator
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict

  codex-project-hooks:
    name: Codex project hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install project and test tools
        run: >-
          python -m pip install --disable-pip-version-check
          -e .
          "pytest>=8.4"
      - name: Execute project hooks from a nested directory
        run: >-
          python -m pytest
          tests/test_installer_failure_paths.py::test_codex_project_hook_executes_from_nested_directory

  pdf-renderer:
    name: PDF download end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install core and PDF renderer
        run: >-
          python -m pip install --disable-pip-version-check
          -e . -e packages/briefspec-renderer-pdf "pytest>=8.4"
      - name: Install Chromium and PDF verification tools
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
      - name: Render and verify PDF
        run: python scripts/run-renderer-smoke.py pdf
      - name: Test PDF renderer failure paths
        run: python -m pytest packages/briefspec-renderer-pdf/tests
      - name: Verify HTML downloads in desktop, mobile, keyboard, and print modes
        run: python scripts/run-browser-e2e.py

  audio-renderer:
    name: Local audio download end to end
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install core and audio renderer
        run: >-
          python -m pip install --disable-pip-version-check
          -e . -e packages/briefspec-renderer-audio "pytest>=8.4"
      - name: Test mocked OpenAI and local-provider boundaries
        run: python -m pytest packages/briefspec-renderer-audio/tests
      - name: Render and verify local MP3
        run: python scripts/run-renderer-smoke.py audio

  release:
    name: Build and clean-room installation
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build tools
        run: >-
          python -m pip install --disable-pip-version-check
          "build>=1.3"
          "jsonschema>=4.23"
          "twine>=6.1"
      - name: Build distributions
        run: |
          python -m build
          python -m build packages/briefspec-renderer-pdf --outdir dist
          python -m build packages/briefspec-renderer-audio --outdir dist
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify wheel resource projections
        run: |
          wheel="$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name 'brief_spec-*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/verify-release.py --wheel "$wheel"
      - name: Clean-room wheel install smoke
        run: |
          smoke_env="$RUNNER_TEMP/brief-spec-wheel-smoke"
          smoke_project="$RUNNER_TEMP/brief-spec-project"
          smoke_state="$RUNNER_TEMP/brief-spec-state"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          mkdir -p "$smoke_project"
          BRIEF_SPEC_HOME="$smoke_state" "$smoke_env/bin/brief-spec" --version
          BRIEF_SPEC_HOME="$smoke_state" "$smoke_env/bin/briefspec" --version
          "$smoke_env/bin/python" -c "import brief_spec,briefspec; assert brief_spec.__version__ == briefspec.__version__"
          BRIEF_SPEC_HOME="$smoke_state" "$smoke_env/bin/brief-spec" capabilities all --json
          BRIEF_SPEC_HOME="$smoke_state" "$smoke_env/bin/brief-spec" \
            install all --scope project --project "$smoke_project"
          BRIEF_SPEC_HOME="$smoke_state" "$smoke_env/bin/brief-spec" \
            doctor all --scope project --project "$smoke_project" --probe
          test -f "$smoke_project/.codex/brief-spec/brief-spec.pyz"
          test -f "$smoke_project/.claude/brief-spec/brief-spec.pyz"
          test -f "$smoke_project/.github/brief-spec/brief-spec.pyz"
          test -f "$smoke_project/.omp/brief-spec/brief-spec.pyz"
          test -f "$smoke_project/.grok/brief-spec/brief-spec.pyz"
          test -f "$smoke_project/.kimi-code/skills/brief-spec/SKILL.md"
      - name: Clean-room sdist install smoke
        run: |
          smoke_env="$RUNNER_TEMP/brief-spec-sdist-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --disable-pip-version-check dist/*.tar.gz
          "$smoke_env/bin/brief-spec" --version
          "$smoke_env/bin/briefspec" --version
          "$smoke_env/bin/brief-spec" capabilities all --json
